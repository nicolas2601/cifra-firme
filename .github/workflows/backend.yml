name: Backend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Reference.slnx
      - run: dotnet build Reference.slnx --configuration Release --no-restore
      - run: dotnet format whitespace Reference.slnx --verify-no-changes --no-restore
      - run: dotnet test Reference.slnx --configuration Release --no-build
      - name: Integración con SQL Server
        shell: bash
        run: |
          set -euo pipefail
          sa_password="Aa1!$(openssl rand -hex 20)"
          echo "::add-mask::$sa_password"
          trap 'docker rm -f payroll-sql >/dev/null 2>&1 || true' EXIT
          docker run -d --name payroll-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$sa_password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..60}; do
            if docker exec payroll-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$sa_password" -C -Q 'SELECT 1' >/dev/null 2>&1; then
              TEST_SQLSERVER="Server=127.0.0.1,1433;User ID=sa;Password=$sa_password;Encrypt=True;TrustServerCertificate=True" \
                dotnet test tests/Reference.Api.Tests --configuration Release --no-build
              exit
            fi
            sleep 2
          done
          docker logs payroll-sql >&2
          exit 1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
